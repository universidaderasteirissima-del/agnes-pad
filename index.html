<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3f9b3a">
<title>Agnes Pad</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --frog:#4caf3f; --frog-dark:#2f7d2a; --frog-light:#7ad16a;
  --screen:#1e74d8; --screen-dark:#1557a8;
  --ink:#ffffff; --pink:#ff7eb6; --yellow:#ffd84d;
  --eye: min(15vw, 15vh, 130px);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
html,body{margin:0; height:100%; overflow:hidden; background:#c9935a; font-family:Fredoka, "Arial Rounded MT Bold", system-ui, sans-serif; color:var(--ink); touch-action:manipulation; overscroll-behavior:none}
body{background: repeating-linear-gradient(90deg,#c58c52 0 120px,#bd844a 120px 122px,#c99359 122px 240px,#b98046 240px 242px)}
button{font-family:inherit; border:0; cursor:pointer; color:inherit}

/* ---------- Moldura de sapinho ---------- */
.pad{position:fixed; left:max(10px,env(safe-area-inset-left)); right:max(10px,env(safe-area-inset-right));
  top:calc(var(--eye)*.55 + 8px); bottom:max(10px,env(safe-area-inset-bottom));
  border-radius:min(6vw,56px); padding:min(3.2vw,30px);
  background:radial-gradient(120% 90% at 50% 0%, var(--frog-light), var(--frog) 45%, var(--frog-dark));
  box-shadow: inset 0 6px 0 rgba(255,255,255,.25), inset 0 -10px 0 rgba(0,0,0,.18), 0 18px 40px rgba(0,0,0,.35)}
.eye{position:absolute; top:calc(var(--eye)*-.62); width:var(--eye); height:var(--eye); border-radius:50%;
  background:radial-gradient(circle at 40% 35%, var(--frog-light), var(--frog) 60%, var(--frog-dark)); padding:calc(var(--eye)*.1); z-index:3;
  box-shadow:0 6px 0 rgba(0,0,0,.15)}
.eye.l{left:7%} .eye.r{right:7%}
.eye .white{width:100%; height:100%; border-radius:50%; background:radial-gradient(circle at 45% 40%, #fff, #e9ece6); position:relative; overflow:hidden;
  box-shadow: inset 0 -5px 0 rgba(0,0,0,.08)}
.eye .pupil{position:absolute; width:48%; height:48%; left:26%; top:26%; border-radius:50%; background:#1b1b1b; transition:transform .25s ease-out}
.eye .pupil::after{content:""; position:absolute; width:32%; height:32%; left:18%; top:16%; border-radius:50%; background:#fff}
.eye .lid{position:absolute; inset:0; background:var(--frog); transform:translateY(-102%); border-radius:50%; animation:blink 5s infinite}
.eye.r .lid{animation-delay:.05s}
@keyframes blink{0%,94%,100%{transform:translateY(-102%)} 97%{transform:translateY(0)}}
.toe{position:absolute; width:min(4vw,34px); height:min(4vw,34px); border-radius:50%; background:var(--frog-light); box-shadow: inset 0 -4px 0 rgba(0,0,0,.15)}

.screen{position:relative; width:100%; height:100%; border-radius:min(3.5vw,32px); overflow:hidden;
  background:radial-gradient(130% 100% at 50% 0%, #3d95f0, var(--screen) 55%, var(--screen-dark));
  box-shadow: inset 0 0 0 4px rgba(0,0,0,.18), inset 0 10px 30px rgba(0,0,0,.25)}
.view{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; padding:3%}
.view.on{display:flex; animation:pop .35s ease-out}
@keyframes pop{from{opacity:0; transform:scale(.96)} to{opacity:1; transform:none}}

.homebtn{position:absolute; z-index:8; left:14px; top:12px; width:min(9vh,72px); height:min(9vh,72px); border-radius:50%; background:rgba(255,255,255,.2); font-size:min(5vh,40px); display:none}
.topright{position:absolute; right:14px; top:12px; z-index:7; display:flex; align-items:center; gap:10px}
.stars{font-size:min(4.5vh,34px); font-weight:700; background:rgba(0,0,0,.18); padding:4px 16px; border-radius:99px}
.volbtn{width:min(8vh,60px); height:min(8vh,60px); border-radius:50%; background:rgba(0,0,0,.18); font-size:min(4.2vh,32px)}
.volpanel{position:absolute; right:0; top:calc(100% + 10px); display:none; align-items:center; gap:12px; background:#fff; color:#1d4f8f; padding:12px 16px; border-radius:24px; box-shadow:0 10px 24px rgba(0,0,0,.3); font-weight:700; font-size:20px}
.volpanel.on{display:flex}
.volpanel button{font-size:28px; background:#eaf3ff; border-radius:50%; width:48px; height:48px}
.volpanel input{width:min(40vw,260px); height:40px; accent-color:#4caf3f}
.volpanel span{min-width:3.2em; text-align:right}
.volpanel{flex-wrap:wrap; justify-content:flex-end; max-width:min(80vw,440px)}
.volpanel .pbtn{width:auto; height:auto; border-radius:99px; font-size:18px; padding:8px 14px; flex-basis:100%}

/* ---------- Painel dos pais ---------- */
#parents{display:none; justify-content:flex-start; align-items:stretch; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:70px 4% 4%; background:#f3f7fc; color:#1d3557; -webkit-user-select:text; user-select:text}
#parents.on{display:block}
#parents h2{margin:0 0 4px; font-size:30px}
#parents h3{margin:26px 0 10px; font-size:22px}
#parents .muted{color:#5b6b80; font-size:16px; font-weight:500}
.lvl{display:flex; align-items:center; gap:18px; background:#fff; border-radius:24px; padding:18px 22px; box-shadow:0 4px 14px rgba(0,0,0,.08)}
.lvl .big-ico{font-size:64px}
.bar{height:16px; background:#e4ebf3; border-radius:99px; overflow:hidden; margin-top:8px}
.bar i{display:block; height:100%; background:#4caf3f; border-radius:99px}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:14px}
.tile{background:#fff; border-radius:20px; padding:14px 16px; box-shadow:0 4px 14px rgba(0,0,0,.06)}
.tile b{display:block; font-size:34px; line-height:1.1}
.tile span{font-size:15px; color:#5b6b80}
.ptable{width:100%; border-collapse:collapse; background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 4px 14px rgba(0,0,0,.06); font-size:16px}
.ptable th,.ptable td{padding:10px 12px; text-align:left; border-bottom:1px solid #eef2f7; vertical-align:middle}
.ptable th{background:#e9f1fb; font-size:14px; color:#40546e}
.ptable td.n{text-align:right; font-variant-numeric:tabular-nums}
.pill{display:inline-block; padding:3px 10px; border-radius:99px; font-size:13px; font-weight:700; white-space:nowrap}
.pill.sabe{background:#d7f5d2; color:#20691a} .pill.quase{background:#fff1c2; color:#7a5600}
.pill.aprendendo{background:#ffe0ee; color:#a2245b} .pill.nova{background:#e9eef5; color:#5b6b80}
.ouviu{color:#5b6b80; font-size:14px}
.pactions{display:flex; flex-wrap:wrap; gap:10px; margin-top:24px}
.pactions button,.pactions label{background:#1d74d8; color:#fff; font-weight:700; font-size:17px; padding:12px 18px; border-radius:99px; cursor:pointer}
.pactions .danger{background:#fff; color:#c0392b; box-shadow:inset 0 0 0 2px #c0392b}
.wsym{font-size:26px; width:40px; text-align:center}
.wsym .sw{display:inline-block; width:24px; height:24px; border-radius:50%}

/* ---------- Lola, a sapinha ---------- */
.lola{width:min(34vh,30vw,300px); aspect-ratio:1/1.02; position:relative; animation:bob 2.4s ease-in-out infinite; flex:none}
.lola svg{width:100%; height:100%; overflow:visible}
@keyframes bob{0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)}}
.lola.happy{animation:jump .5s ease-out 2}
@keyframes jump{0%,100%{transform:translateY(0) scale(1)} 40%{transform:translateY(-34px) scale(1.04,.96)}}
.lola .lid2{transform-box:fill-box; transform-origin:center top; animation:blink2 4.2s infinite}
@keyframes blink2{0%,93%,100%{transform:scaleY(0)} 96%{transform:scaleY(1)}}

/* ---------- Início ---------- */
.hi{font-family:Pacifico, cursive; font-size:min(18vh,14vw); line-height:1.15; text-shadow:0 6px 0 rgba(0,0,0,.15); margin:0}
.sub{font-size:min(5vh,4vw); font-weight:700; margin:.2em 0 .8em}
.big{background:var(--yellow); color:#5a3b00; font-weight:700; font-size:min(5.5vh,4.5vw); padding:.5em 1.4em; border-radius:99px;
  box-shadow:0 8px 0 #c99a10, 0 14px 24px rgba(0,0,0,.25); transition:transform .1s}
.big:active{transform:translateY(6px); box-shadow:0 2px 0 #c99a10}

/* ---------- Menu ---------- */
.menu{display:flex; gap:4%; width:100%; justify-content:center; align-items:stretch}
.card{flex:0 1 30%; max-width:340px; aspect-ratio:1/1.05; border-radius:36px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4%;
  font-size:min(6vh,4.6vw); font-weight:700; box-shadow:0 10px 0 rgba(0,0,0,.2), 0 18px 30px rgba(0,0,0,.25); transition:transform .1s}
.card:active{transform:translateY(8px) scale(.98)}
.card .ico{font-size:min(20vh,15vw); line-height:1}
.card.en{background:linear-gradient(#ff9ccb,#ff6fae)}
.card.sn{background:linear-gradient(#ffe066,#ffbf1f); color:#6b4500}
.card.gr{background:linear-gradient(#c4b5fd,#8b5cf6)}

/* ---------- Guarda-roupa ---------- */
#wardrobe{flex-direction:row; align-items:stretch; justify-content:flex-start; gap:2%; padding:72px 2% 2%}
.stage{flex:0 0 40%; position:relative; border-radius:30px; background:radial-gradient(60% 50% at 50% 55%, rgba(255,255,255,.28), rgba(255,255,255,.06)); transition:box-shadow .15s, background .15s; touch-action:none}
.stage.glow{box-shadow:inset 0 0 0 6px var(--yellow); background:rgba(255,216,77,.22)}
#doll{position:absolute; inset:2% 2% 88px; display:flex; align-items:center; justify-content:center}
#doll svg{height:100%; width:100%; overflow:visible; touch-action:none}
#doll .worn{cursor:grab}
#doll .lifted{opacity:.25}
.wtools{position:absolute; left:0; right:0; bottom:10px; display:flex; justify-content:center; gap:14px}
.wtools button{width:min(9vh,70px); height:min(9vh,70px); border-radius:50%; background:#fff; font-size:min(5vh,36px); box-shadow:0 6px 0 rgba(0,0,0,.18)}
.wtools button:active{transform:translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.18)}
.closet{flex:1; min-width:0; min-height:0; display:flex; gap:12px; padding:14px; border-radius:30px; background:linear-gradient(#c58a5a,#9a6038); box-shadow:inset 0 0 0 6px #7c4a29, 0 10px 0 rgba(0,0,0,.2)}
.wtabs{flex:none; width:min(11vh,92px); overflow-y:auto; -webkit-overflow-scrolling:touch; display:flex; flex-direction:column; gap:10px; touch-action:pan-y; padding:2px}
.wtab{flex:none; width:100%; aspect-ratio:1; border-radius:22px; background:#fbe9d7; padding:6px; box-shadow:0 4px 0 rgba(0,0,0,.15)}
.wtab.on{background:#fff; box-shadow:0 0 0 5px var(--yellow)}
.wtab svg{width:100%; height:100%}
.witems{flex:1; min-width:0; display:grid; grid-template-columns:repeat(3,1fr); grid-auto-rows:min-content; gap:12px; align-content:start; background:#fff4ea; border-radius:22px; padding:12px; overflow:hidden; touch-action:none}
.whead{grid-column:1/-1; color:#7c4a29; font-weight:700; font-size:min(4.4vh,30px); padding:0 4px}
.item{background:#fff; border-radius:20px; box-shadow:0 4px 0 rgba(0,0,0,.1); display:flex; flex-direction:column; align-items:center; padding:6px; aspect-ratio:1; touch-action:none; transition:transform .1s}
.item.press{transform:scale(.94)}
.item.worn{box-shadow:0 0 0 4px #4caf3f}
.item svg{width:100%; flex:1; min-height:0; pointer-events:none}
.item b{font-size:min(2.6vh,18px); color:#1d4f8f}
.ghost{position:fixed; width:min(24vh,180px); height:min(24vh,180px); pointer-events:none; z-index:60; transform:translate(-50%,-50%) scale(1.1); filter:drop-shadow(0 12px 12px rgba(0,0,0,.3))}
.ghost svg{width:100%; height:100%}
.spark{position:absolute; font-size:min(5vh,34px); pointer-events:none; animation:sparkle 1s ease-out forwards}
@keyframes sparkle{0%{opacity:0; transform:scale(.3)} 30%{opacity:1; transform:scale(1.2)} 100%{opacity:0; transform:translateY(-30px) scale(.8)}}
.flash{position:absolute; inset:0; background:#fff; border-radius:30px; animation:flash .6s ease-out forwards; z-index:9; pointer-events:none}
@keyframes flash{from{opacity:.95} to{opacity:0}}
.menu-top{display:flex; align-items:center; gap:2%; margin-bottom:2%}
.menu-top .lola{width:min(20vh,16vw)}
.bubble{background:#fff; color:#1d4f8f; font-weight:700; font-size:min(4.6vh,3.6vw); padding:.5em .9em; border-radius:26px; position:relative; max-width:60vw}
.bubble::before{content:""; position:absolute; left:-14px; top:45%; border:10px solid transparent; border-right:16px solid #fff; border-left:0}

/* ---------- Inglês ---------- */
#learn{flex-direction:row; gap:3%}
.learn-left{display:flex; flex-direction:column; align-items:center; gap:10px}
.word-card{position:relative; width:min(62vh,48vw); aspect-ratio:1/1; background:#fff; border-radius:40px; display:flex; flex-direction:column; align-items:center; justify-content:center;
  box-shadow:0 12px 0 rgba(0,0,0,.18), 0 20px 34px rgba(0,0,0,.25)}
.word-card .pic{font-size:min(30vh,22vw); line-height:1.1}
.word-card .swatch{width:55%; aspect-ratio:1; border-radius:50%; box-shadow:inset 0 -12px 0 rgba(0,0,0,.15)}
.word-card .num{font-size:min(34vh,26vw); font-weight:700; color:#ff6fae; line-height:1}
.word-card .txt{font-size:min(9vh,7vw); font-weight:700; color:#1d4f8f; letter-spacing:.02em}
.word-card.win{animation:win .6s ease-out}
@keyframes win{30%{transform:scale(1.08) rotate(-3deg)} 60%{transform:scale(.97) rotate(2deg)}}
.dots{display:flex; gap:10px; margin-top:4px}
.dots i{width:18px; height:18px; border-radius:50%; background:rgba(255,255,255,.3)}
.dots i.done{background:var(--yellow)}
.mic{width:min(14vh,11vw); height:min(14vh,11vw); border-radius:50%; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; font-size:min(7vh,5.5vw); transition:.2s}
.mic.tap{background:var(--yellow); animation:bob .8s ease-in-out infinite; cursor:pointer; box-shadow:0 0 0 8px rgba(255,216,77,.4)}
.mic.listening{background:#ff4d6d; animation:pulse 1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,77,109,.7)} 100%{box-shadow:0 0 0 30px rgba(255,77,109,0)}}
.ear{position:absolute; left:14px; bottom:14px; font-size:min(6vh,4.5vw); background:#eaf3ff; border-radius:50%; width:1.7em; height:1.7em}
.ok-parent{position:absolute; right:14px; bottom:14px; font-size:min(4vh,3vw); background:#eaf3ff; border-radius:50%; width:1.9em; height:1.9em; opacity:.55}
.parent-row{display:none; gap:12px; margin-top:10px}
.parent-row.on{display:flex}
.parent-row button{background:#fff; color:#1d4f8f; font-weight:700; font-size:min(3.6vh,2.8vw); padding:.4em .9em; border-radius:99px}
.heard{font-size:14px; opacity:.6; min-height:1.2em; max-width:40vw; text-align:center}

/* ---------- Fim da rodada ---------- */
.trophy{font-size:min(26vh,20vw); animation:jump .6s ease-out 3}
.row{display:flex; gap:20px; margin-top:4%}
.big.alt{background:#fff; color:#1d4f8f; box-shadow:0 8px 0 #b9c9dd, 0 14px 24px rgba(0,0,0,.25)}

/* ---------- Cobrinha ---------- */
#snake{padding:0}
#board{position:absolute; inset:0; width:100%; height:100%; touch-action:none}
.arrows{position:absolute; right:3%; bottom:4%; display:grid; grid-template-columns:repeat(3, min(11vh,9vw)); grid-template-rows:repeat(3, min(11vh,9vw)); gap:6px; z-index:5}
.arrows button{background:rgba(255,255,255,.28); border-radius:22px; font-size:min(6vh,4.6vw); font-weight:700}
.arrows button:active{background:rgba(255,255,255,.55)}
.arrows .u{grid-column:2; grid-row:1} .arrows .l{grid-column:1; grid-row:2} .arrows .r{grid-column:3; grid-row:2} .arrows .d{grid-column:2; grid-row:3}
.score{position:absolute; left:50%; top:14px; transform:translateX(-50%); font-size:min(5vh,4vw); font-weight:700; background:rgba(0,0,0,.18); padding:4px 18px; border-radius:99px; z-index:4}
.overlay{position:absolute; inset:0; display:none; flex-direction:column; align-items:center; justify-content:center; background:rgba(14,60,120,.55); z-index:3; gap:3%; pointer-events:none}
.overlay .big{pointer-events:auto}
.overlay.on{display:flex}
.overlay .msg{font-size:min(7vh,5.5vw); font-weight:700; text-align:center}
.wordpop{position:absolute; font-size:min(8vh,6vw); font-weight:700; color:#fff; text-shadow:0 4px 0 rgba(0,0,0,.25); pointer-events:none; animation:rise 1.2s ease-out forwards; z-index:5}
@keyframes rise{from{opacity:1; transform:translate(-50%,0) scale(.7)} to{opacity:0; transform:translate(-50%,-90px) scale(1.15)}}

.confetti{position:absolute; top:-20px; width:14px; height:20px; border-radius:4px; z-index:9; pointer-events:none; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

@media (orientation:portrait){
  #learn{flex-direction:column}
  .learn-left{flex-direction:row}
  .lola{width:min(24vh,40vw)}
  .word-card{width:min(78vw,52vh)}
  .menu{flex-direction:column; align-items:center}
  .card{flex:none; width:min(60vw,22vh); aspect-ratio:1.5/1}
  .card .ico{font-size:min(10vh,15vw)}
  #wardrobe{flex-direction:column}
  .stage{flex:0 0 46%}
  .closet{flex-direction:column}
  .wtabs{flex-direction:row; width:auto; height:min(9vh,90px); overflow-x:auto; overflow-y:hidden; touch-action:pan-x}
  .wtab{height:100%; width:auto}
  .witems{grid-template-columns:repeat(4,1fr); gap:8px; padding:8px}
}
</style>
</head>
<body>
<div class="pad" id="pad">
  <div class="eye l"><div class="white"><div class="pupil"></div><div class="lid"></div></div></div>
  <div class="eye r"><div class="white"><div class="pupil"></div><div class="lid"></div></div></div>

  <div class="screen" id="screen">
    <button class="homebtn" id="homebtn" aria-label="Início">🏠</button>
    <div class="topright">
      <div class="stars" id="stars">⭐ 0</div>
      <button class="volbtn" id="volBtn" aria-label="Volume">🔊</button>
      <div class="volpanel" id="volPanel">
        <button id="volMute" aria-label="Sem som">🔇</button>
        <input type="range" id="vol" min="0" max="100" step="5" aria-label="Volume">
        <span id="volTxt">80%</span>
        <button id="openParents" class="pbtn">📊 Painel dos pais</button>
      </div>
    </div>

    <!-- Início -->
    <section class="view on" id="start">
      <div class="lola" data-lola></div>
      <h1 class="hi">Oi, Agnes!</h1>
      <button class="big" id="go">Vamos brincar! ▶</button>
    </section>

    <!-- Menu -->
    <section class="view" id="menu">
      <div class="menu-top"><div class="lola" data-lola></div><div class="bubble">Escolhe uma brincadeira!</div></div>
      <div class="menu">
        <button class="card en" id="goLearn"><div class="ico">🗣️</div>Inglês</button>
        <button class="card sn" id="goSnake"><div class="ico">🐍</div>Cobrinha</button>
        <button class="card gr" id="goWardrobe"><div class="ico">👗</div>Guarda-roupa</button>
      </div>
    </section>

    <!-- Inglês -->
    <section class="view" id="learn">
      <div class="learn-left">
        <div class="lola" data-lola id="learnLola"></div>
        <div class="mic" id="mic">🎤</div>
        <div class="heard" id="heard"></div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center">
        <div class="word-card" id="wordCard">
          <div id="pic"></div>
          <div class="txt" id="wordTxt"></div>
          <button class="ear" id="ear" aria-label="Ouvir de novo">👂</button>
          <button class="ok-parent" id="okParent" aria-label="Ela acertou (pais)">👍</button>
        </div>
        <div class="dots" id="dots"></div>
        <div class="parent-row" id="parentRow">
          <button id="pYes">✅ Ela falou!</button><button id="pAgain">🔁 De novo</button>
        </div>
      </div>
    </section>

    <!-- Fim da rodada -->
    <section class="view" id="done">
      <div class="trophy">🏆</div>
      <div class="sub" id="doneTxt">Parabéns, Agnes!</div>
      <div class="row"><button class="big" id="more">Mais palavras ▶</button><button class="big alt" id="toMenu">🏠</button></div>
    </section>

    <!-- Guarda-roupa -->
    <section class="view" id="wardrobe">
      <div class="stage" id="stage">
        <div id="doll"></div>
        <div class="wtools">
          <button id="wRandom" aria-label="Surpresa">🎲</button>
          <button id="wPhoto" aria-label="Foto">📸</button>
          <button id="wClear" aria-label="Tirar tudo">🧹</button>
        </div>
      </div>
      <div class="closet">
        <div class="wtabs" id="wTabs"></div>
        <div class="witems" id="wItems"></div>
      </div>
    </section>

    <!-- Painel dos pais -->
    <section class="view" id="parents"></section>

    <!-- Cobrinha -->
    <section class="view" id="snake">
      <canvas id="board"></canvas>

</div>

<script>
"use strict";
const $ = s => document.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
let C = null;                 // content.json
let session = 0;              // muda a cada troca de tela: cancela falas em andamento
const store = {
  get(k, d){ try{ const v = localStorage.getItem("agnespad:"+k); return v == null ? d : JSON.parse(v) }catch(e){ return d } },
  set(k, v){ try{ localStorage.setItem("agnespad:"+k, JSON.stringify(v)) }catch(e){} }
};

/* ---------- Lola em todas as telas ---------- */
document.querySelectorAll("[data-lola]").forEach(el => el.appendChild($("#lolaTpl").content.cloneNode(true)));

/* olhos da moldura seguem o dedo */
function lookAt(x, y){
  document.querySelectorAll(".eye .pupil").forEach(p => {
    const r = p.parentElement.getBoundingClientRect();
    const cx = r.left + r.width/2, cy = r.top + r.height/2;
    const a = Math.atan2(y-cy, x-cx), d = Math.min(1, Math.hypot(x-cx, y-cy)/300) * r.width*0.2;
    p.style.transform = `translate(${Math.cos(a)*d}px, ${Math.sin(a)*d}px)`;
  });
}
addEventListener("pointerdown", e => lookAt(e.clientX, e.clientY));
addEventListener("pointermove", e => lookAt(e.clientX, e.clientY));

/* ---------- Estrelinhas ---------- */
let stars = store.get("stars", 0);
const showStars = () => $("#stars").textContent = "⭐ " + stars;
showStars();
function addStar(){ stars++; store.set("stars", stars); showStars(); }

/* ---------- Registro do aprendizado (fica salvo neste iPad) ---------- */
const today = () => new Date().toLocaleDateString("sv");          // AAAA-MM-DD
const stats = Object.assign({v: 1, inicio: today(), words: {}, days: {}, snake: {partidas: 0, recorde: 0, frutas: 0}}, store.get("stats", {}));
const saveStats = () => store.set("stats", stats);
const day = () => stats.days[today()] || (stats.days[today()] = {min: 0, palavras: 0, voz: 0, ajuda: 0, nao: 0, cobrinha: 0});
const wst = id => stats.words[id] || (stats.words[id] = {vistas: 0, voz1: 0, voz: 0, ajuda: 0, nao: 0, seq: 0, ultima: 0, hist: [], ouviu: []});
/* resultado de cada palavra: voz1 = acertou de primeira falando · voz = acertou depois de repetir · ajuda = 👍 dos pais · nao = não conseguiu */
function record(w, res, heard){
  const s = wst(w.id); s.vistas++; s[res]++; s.ultima = Date.now();
  s.seq = res === "voz1" ? s.seq + 1 : res === "voz" ? s.seq : 0;
  s.hist = [res, ...s.hist].slice(0, 12);
  const h = (heard || []).filter(Boolean);
  if (h.length) s.ouviu = [h[h.length-1], ...s.ouviu.filter(x => x !== h[h.length-1])].slice(0, 4);
  const d = day(); d.palavras++; d[res === "voz1" ? "voz" : res]++;
  saveStats();
}
/* sabe = 3 acertos de primeira seguidos, só pela voz · quase = já acertou falando · aprendendo = já viu */
function status(id){
  const s = stats.words[id];
  if (!s || !s.vistas) return "nova";
  if (s.seq >= 3) return "sabe";
  if (s.voz1 + s.voz > 0) return "quase";
  return "aprendendo";
}
const STATUS_TXT = {sabe: "Sabe falar", quase: "Quase lá", aprendendo: "Aprendendo", nova: "Ainda não viu"};
const NIVEIS = [[0, "🥚", "Ovinho"], [3, "💧", "Girino"], [8, "🐸", "Sapinha"], [15, "🌸", "Sapinha Sabida"], [22, "👑", "Rainha das Palavras"], [30, "🏆", "Sapa Mestre"]];
function nivel(){
  const n = C.words.filter(w => status(w.id) === "sabe").length;
  let i = 0; while (i + 1 < NIVEIS.length && n >= NIVEIS[i+1][0]) i++;
  return {n, i, ico: NIVEIS[i][1], nome: NIVEIS[i][2], prox: NIVEIS[i+1] || null, base: NIVEIS[i][0]};
}
/* tempo de uso: conta a cada 15 s com o app aberto e visível */
setInterval(() => {
  if (document.visibilityState !== "visible") return;
  const v = document.querySelector(".view.on");
  if (!v || v.id === "start" || v.id === "parents") return;
  day().min += .25; saveStats();
}, 15000);

/* ---------- Áudio (Web Audio: funciona bem no iPad depois do 1º toque) ---------- */
const AC = new (window.AudioContext || window.webkitAudioContext)();
const master = AC.createGain(); master.connect(AC.destination);
const analyser = AC.createAnalyser(); analyser.fftSize = 512; analyser.connect(master);
let volume = store.get("volume", 80);
function setVolume(v){
  volume = Math.max(0, Math.min(100, Math.round(v))); store.set("volume", volume);
  master.gain.value = Math.pow(volume/100, 2);            // curva mais natural para o ouvido
  $("#vol").value = volume; $("#volTxt").textContent = volume + "%";
  $("#volBtn").textContent = volume === 0 ? "🔇" : volume < 50 ? "🔉" : "🔊";
}
let lastVol = volume || 80;
$("#volBtn").onclick = e => { e.stopPropagation(); $("#volPanel").classList.toggle("on") };
$("#volPanel").addEventListener("click", e => e.stopPropagation());
$("#vol").addEventListener("input", e => { setVolume(+e.target.value); if (volume) lastVol = volume });
$("#volMute").onclick = () => setVolume(volume ? (lastVol = volume, 0) : lastVol);
document.addEventListener("click", () => $("#volPanel").classList.remove("on"));
setVolume(volume);
const buffers = {};
let curSrc = null;

function load(id){
  if (!buffers[id]) buffers[id] = fetch(`audio/${id}.mp3`)
    .then(r => { if (!r.ok) throw 0; return r.arrayBuffer() })
    .then(ab => new Promise((res, rej) => AC.decodeAudioData(ab, res, rej)))
    .catch(() => null);
  return buffers[id];
}
function setTalking(on){
  document.querySelectorAll(".lola").forEach(l => {
    l.querySelector(".smile").style.display = on ? "none" : "";
    l.querySelector(".talk").style.display = on ? "" : "none";
  });
}
/* boca mexe conforme o volume */
const lvl = new Uint8Array(256);
(function mouthLoop(){
  if (curSrc){
    analyser.getByteTimeDomainData(lvl);
    let m = 0; for (const v of lvl) m = Math.max(m, Math.abs(v-128));
    const ry = 4 + Math.min(1, m/50) * 16;
    document.querySelectorAll(".lola .mouth").forEach(e => e.setAttribute("ry", ry.toFixed(1)));
  }
  requestAnimationFrame(mouthLoop);
})();

function stopAudio(){
  if (curSrc && curSrc.stop){ try{ curSrc.onended = null; curSrc.stop() }catch(e){} }
  if (curSrc && curSrc.done) curSrc.done();
  curSrc = null; setTalking(false);
}
async function say(id){
  const tok = session;
  if (AC.state !== "running") await Promise.race([AC.resume().catch(() => {}), sleep(400)]);
  const buf = await load(id);
  if (tok !== session || forceOk || !buf) return;
  setTalking(true);
  await new Promise(res => {
    if (buf){
      const s = AC.createBufferSource(); s.buffer = buf; s.connect(analyser);
      s.done = res; s.onended = () => { if (curSrc === s) curSrc = null; res() };
      curSrc = s; s.start();
    } else res();                             // só a voz da Lola: sem mp3, fica em silêncio
  });
  setTalking(false);
}
function sfx(type){
  const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime;
  o.connect(g); g.connect(master);
  const notes = type === "win" ? [523, 659, 784, 1046] : type === "eat" ? [660, 990] : [300, 200];
  notes.forEach((f, i) => o.frequency.setValueAtTime(f, t + i*.09));
  o.type = "triangle"; g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + notes.length*.09 + .15);
  o.start(t); o.stop(t + notes.length*.09 + .2);
}
function confetti(){
  const cols = ["#ffd84d", "#ff6fae", "#7ad16a", "#fff", "#5ec8ff"];
  for (let i = 0; i < 60; i++){
    const c = document.createElement("div"); c.className = "confetti";
    c.style.left = Math.random()*100 + "%"; c.style.background = cols[i % cols.length];
    c.style.animationDuration = (1.6 + Math.random()*1.4) + "s"; c.style.animationDelay = Math.random()*.4 + "s";
    $("#screen").appendChild(c); setTimeout(() => c.remove(), 3500);
  }
}
const pick = a => a[Math.floor(Math.random()*a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]] } return a };

/* ---------- Telas ---------- */
function show(id){
  session++; stopAudio(); stopListening(); stopSnake();
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === id));
  $("#volPanel").classList.remove("on");
  $("#homebtn").style.display = (id === "start" || id === "menu") ? "none" : "block";
}
$("#homebtn").onclick = () => goMenu();
$("#toMenu").onclick = () => goMenu();

$("#go").onclick = async () => {
  AC.resume().catch(() => {});
  goMenu(true);
};
async function goMenu(first){
  show("menu"); const tok = session;
  await say(first ? "welcome" : "menu");
  if (first && tok === session) await say("menu");
}
$("#goLearn").onclick = () => startLearn(true);
$("#goSnake").onclick = () => startSnake();
$("#more").onclick = () => startLearn(false);

/* ---------- Reconhecimento de fala ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, parentAnswer = null, micDenied = false;
function stopListening(){
  if (rec){ try{ rec.abort() }catch(e){} rec = null }
  $("#mic").classList.remove("listening");
  if (parentAnswer) parentAnswer(null);
}
const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
function lev(a, b){
  const d = Array.from({length: a.length+1}, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++) for (let j = 1; j <= b.length; j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function matches(heard, w){
  const targets = [w.en, ...(w.alt || [])].map(norm);
  for (const h of heard){
    const n = " " + norm(h) + " ";
    if (targets.some(t => n.includes(" " + t + " "))) return true;
    for (const tok of n.trim().split(" ")){
      if (tok.length >= 3 && lev(tok, norm(w.en)) <= (w.en.length >= 5 ? 2 : 1)) return true;
    }
  }
  return false;
}
/* escuta a Agnes. Resolve {ok, silent}. Se o iPad exigir um toque, o microfone vira botão; sem microfone, aparecem os botões dos pais */
let needTap = false, micTap = null, forceOk = false;
function listen(w){
  return new Promise(resolve => {
    if (forceOk){ forceOk = false; return resolve({ok: true, parent: true}) }
    let done = false, timer = null, tapped = false; const heard = [];
    const mic = $("#mic");
    const finish = r => { if (done) return; done = true; clearTimeout(timer); parentAnswer = null; micTap = null;
      if (rec){ try{ rec.abort() }catch(e){} rec = null } mic.classList.remove("listening", "tap"); $("#parentRow").classList.remove("on"); resolve(r) };
    const result = () => finish({ok: matches(heard, w), silent: heard.length === 0, heard});
    parentAnswer = ok => finish(ok === null ? {cancel: true} : {ok, silent: false, parent: true});
    const toParents = () => { clearTimeout(timer); micDenied = true; mic.classList.remove("listening", "tap"); $("#parentRow").classList.add("on") };
    const awaitTap = () => {
      clearTimeout(timer); needTap = true; mic.classList.remove("listening"); mic.classList.add("tap");
      micTap = () => { micTap = null; tapped = true; mic.classList.remove("tap"); begin() };
    };
    const begin = () => {
      const r = rec = new SR(); r.lang = "en-US"; r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
      let waiting = false;
      r.onresult = e => {
        for (let i = 0; i < e.results.length; i++) for (let j = 0; j < e.results[i].length; j++) heard.push(e.results[i][j].transcript);
        $("#heard").textContent = "ouvi: " + heard[heard.length-1];
        if (matches(heard, w)) finish({ok: true, heard});
      };
      r.onerror = e => {
        if (e.error === "not-allowed" || e.error === "service-not-allowed"){ waiting = true; tapped ? toParents() : awaitTap() }
      };
      r.onend = () => { if (r !== rec || waiting || done) return; setTimeout(result, 250) };
      clearTimeout(timer); timer = setTimeout(result, 7000);
      try{ r.start(); mic.classList.add("listening") }
      catch(e){ waiting = true; tapped ? toParents() : awaitTap() }
    };
    if (!SR || micDenied) toParents();
    else if (needTap) awaitTap();
    else begin();
  });
}
$("#mic").addEventListener("click", () => micTap && micTap());
$("#okParent").onclick = () => { if (parentAnswer) parentAnswer(true); else { forceOk = true; stopAudio() } };
$("#pYes").onclick = () => parentAnswer && parentAnswer(true);
$("#pAgain").onclick = () => parentAnswer && parentAnswer(false);

/* ---------- Aula de inglês ---------- */
const ROUND = 5;
let queue = [], idx = 0, curWord = null;
function renderWord(w){
  curWord = w;
  const pic = $("#pic");
  pic.className = ""; pic.removeAttribute("style"); pic.textContent = "";
  if (w.emoji){ pic.className = "pic"; pic.textContent = w.emoji }
  else if (w.color){ pic.className = "swatch"; pic.style.background = w.color }
  else { pic.className = "num"; pic.textContent = w.num }
  $("#wordTxt").textContent = w.en;
  $("#heard").textContent = "";
  $("#dots").innerHTML = Array.from({length: ROUND}, (_, i) => `<i class="${i < idx ? "done" : ""}"></i>`).join("");
}
const canReplay = () => curWord && !curSrc && !rec;
$("#ear").onclick = () => { if (canReplay()) say("en_" + curWord.id) };
$("#wordCard").addEventListener("click", e => { if (e.target.closest("button")) return; if (canReplay()) say("en_" + curWord.id) });

async function startLearn(intro){
  show("learn"); const tok = session;
  queue = pickRound();
  idx = 0; forceOk = false; renderWord(queue[0]);
  if (intro) await say("learn_in");
  while (tok === session && idx < ROUND){
    await runWord(queue[idx], tok);
    if (tok !== session) return;
    idx++;
    if (idx < ROUND){ renderWord(queue[idx]); await say("next") }
  }
  if (tok !== session) return;
  show("done"); confetti(); sfx("win");
  $("#doneTxt").textContent = `Parabéns, Agnes! Você tem ${stars} estrelinhas!`;
  await say("good4");
}
/* rodada: até 3 palavras em treino, 1–2 novas e 1 revisão das que ela já sabe */
function pickRound(){
  const last = w => (stats.words[w.id] || {}).ultima || 0;
  const of = st => C.words.filter(w => status(w.id) === st);
  const treino = [...of("quase"), ...of("aprendendo")].sort((a, b) => last(a) - last(b));
  const novas = of("nova");                       // na ordem do content.json
  const sabe = of("sabe").sort((a, b) => last(a) - last(b));
  const r = [];
  const add = (list, n) => { for (const w of list){ if (r.length >= ROUND || n <= 0) break; if (!r.includes(w)){ r.push(w); n-- } } };
  add(treino, 3);
  if (treino.length < 8) add(novas, 4 - r.length > 0 ? 4 - r.length : 1);
  add(sabe, 1);
  add(treino, ROUND); add(novas, ROUND); add(sabe, ROUND);
  return shuffle(r);
}
async function runWord(w, tok){
  renderWord(w);
  for (const id of ["pt_" + w.id, "inEnglish", "en_" + w.id, "yourTurn"]){ if (tok !== session) return; if (forceOk) break; await say(id) }
  let tries = 0, silent = 0; const allHeard = [];
  while (tok === session){
    const r = await listen(w);
    if (tok !== session || r.cancel) return;
    if (!r.ok && r.heard) allHeard.push(...r.heard);
    if (r.ok){
      record(w, r.parent ? "ajuda" : tries === 0 && silent === 0 ? "voz1" : "voz", allHeard.concat(r.heard || []));
      addStar(); sfx("win"); confetti();
      $("#wordCard").classList.remove("win"); void $("#wordCard").offsetWidth; $("#wordCard").classList.add("win");
      $("#learnLola").classList.add("happy"); setTimeout(() => $("#learnLola").classList.remove("happy"), 1100);
      await say(pick(["good1", "good2", "good3"]));
      forceOk = false;
      return;
    }
    if (r.silent && !r.parent){
      silent++;
      if (silent > 2){ record(w, "nao", allHeard); await say("tried"); forceOk = false; return }
      await say("noHear"); await say("en_" + w.id);
      continue;
    }
    tries++;
    if (tries >= 3){ record(w, "nao", allHeard); await say("tried"); forceOk = false; return }
    await say(tries === 1 ? "again1" : "again2"); await say("en_" + w.id);
  }
}

/* ---------- Cobrinha ---------- */
const cv = $("#board"), ctx = cv.getContext("2d");
let S = null, loop = null;
function stopSnake(){ if (loop){ clearTimeout(loop); loop = null } }
function sizeBoard(){
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = r.width*dpr; cv.height = r.height*dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cols = 16, cell = Math.floor(r.width/cols);
  return {cols, rows: Math.floor(r.height/cell), cell, w: r.width, h: r.height};
}
function newFood(){
  let p;
  do { p = {x: Math.floor(Math.random()*S.g.cols), y: 1 + Math.floor(Math.random()*(S.g.rows-1))} }
  while (S.body.some(b => b.x === p.x && b.y === p.y));
  const id = pick(C.snakeFoods);
  S.food = {...p, id, emoji: C.words.find(w => w.id === id).emoji};
}
async function startSnake(){
  show("snake"); const tok = session;
  await new Promise(requestAnimationFrame);
  const g = sizeBoard();
  const cx = Math.floor(g.cols/3), cy = Math.floor(g.rows/2);
  S = {g, body: [{x: cx, y: cy}, {x: cx-1, y: cy}, {x: cx-2, y: cy}], dir: {x: 1, y: 0}, next: null, score: 0, alive: true, started: false, speed: 330};
  newFood(); $("#score").textContent = "🍎 0";
  $("#snakeMsg").innerHTML = "Toca numa setinha<br>para começar!"; $("#snakeAgain").style.display = "none"; $("#snakeOver").classList.add("on");
  draw();
  await say("snake_in");
}
function setDir(dx, dy){
  if (!S || !S.alive || !$("#snake").classList.contains("on")) return;
  if (S.dir.x === -dx && S.dir.y === -dy && S.body.length > 1) return;
  S.next = {x: dx, y: dy};
  if (!S.started){ S.started = true; $("#snakeOver").classList.remove("on"); S.dir = S.next; tick() }
}
document.querySelectorAll(".arrows button").forEach(b => b.addEventListener("pointerdown", e => {
  e.preventDefault(); const [x, y] = b.dataset.d.split(",").map(Number); setDir(x, y);
}));
let sw = null;
cv.addEventListener("pointerdown", e => sw = {x: e.clientX, y: e.clientY});
cv.addEventListener("pointerup", e => {
  if (!sw) return;
  if (S && !S.started && S.alive && Math.hypot(e.clientX - sw.x, e.clientY - sw.y) < 25){ sw = null; return setDir(1, 0) } const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
  Math.abs(dx) > Math.abs(dy) ? setDir(Math.sign(dx), 0) : setDir(0, Math.sign(dy));
});
addEventListener("keydown", e => {
  const k = {ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0]}[e.key];
  if (k){ e.preventDefault(); setDir(...k) }
});
function tick(){
  if (!S.alive) return;
  if (S.next){ S.dir = S.next; S.next = null }
  const g = S.g, h = S.body[0];
  // sem paredes: a cobrinha atravessa e sai do outro lado
  const n = {x: (h.x + S.dir.x + g.cols) % g.cols, y: (h.y + S.dir.y + g.rows) % g.rows};
  const eat = n.x === S.food.x && n.y === S.food.y;
  const tail = eat ? S.body : S.body.slice(0, -1);
  if (tail.some(b => b.x === n.x && b.y === n.y)){ return snakeOver() }
  S.body.unshift(n); if (!eat) S.body.pop();
  if (eat){
    S.score++; $("#score").textContent = "🍎 " + S.score; sfx("eat");
    const pop = document.createElement("div"); pop.className = "wordpop";
    const w = C.words.find(x => x.id === S.food.id);
    pop.textContent = w.en + "!"; pop.style.left = ((g.w - g.cols*g.cell)/2 + (n.x+.5)*g.cell) + "px"; pop.style.top = ((g.h - g.rows*g.cell)/2 + (n.y-1)*g.cell) + "px";
    $("#snake").appendChild(pop); setTimeout(() => pop.remove(), 1300);
    say("en_" + S.food.id);
    if (S.score % 5 === 0){ addStar(); confetti() }
    S.speed = Math.max(190, S.speed - 8);
    newFood();
  }
  draw();
  loop = setTimeout(tick, S.speed);
}
async function snakeOver(){
  stats.snake.partidas++; stats.snake.frutas += S.score; stats.snake.recorde = Math.max(stats.snake.recorde, S.score);
  day().cobrinha++; saveStats();
  S.alive = false; sfx("ops"); draw();
  $("#snakeMsg").innerHTML = `Você comeu ${S.score} ${S.score === 1 ? "frutinha" : "frutinhas"}! 🎉`;
  $("#snakeAgain").style.display = ""; $("#snakeOver").classList.add("on");
  await say("snake_ops");
}
$("#snakeAgain").onclick = () => startSnake();
function draw(){
  const g = S.g, c = g.cell, ox = (g.w - g.cols*c)/2, oy = (g.h - g.rows*c)/2;
  ctx.clearRect(0, 0, g.w, g.h);
  // grama quadriculada
  for (let y = 0; y < g.rows; y++) for (let x = 0; x < g.cols; x++){
    ctx.fillStyle = (x + y) % 2 ? "rgba(255,255,255,.06)" : "rgba(255,255,255,.12)";
    ctx.fillRect(ox + x*c, oy + y*c, c, c);
  }
  ctx.fillStyle = "#000"; ctx.font = `${c*.85}px serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(S.food.emoji, ox + (S.food.x+.5)*c, oy + (S.food.y+.55)*c);
  const L = S.body.length;
  for (let i = L-1; i >= 0; i--){
    const b = S.body[i], t = i/Math.max(1, L-1);
    ctx.fillStyle = `hsl(${320 - t*40}, 85%, ${68 - t*8}%)`;
    ctx.beginPath(); ctx.arc(ox + (b.x+.5)*c, oy + (b.y+.5)*c, c*(i === 0 ? .52 : .46 - t*.08), 0, 7); ctx.fill();
    if (i % 2 === 1){ ctx.fillStyle = "rgba(255,255,255,.35)"; ctx.beginPath(); ctx.arc(ox + (b.x+.5)*c, oy + (b.y+.5)*c, c*.12, 0, 7); ctx.fill() }
  }
  // carinha
  const h = S.body[0], hx = ox + (h.x+.5)*c, hy = oy + (h.y+.5)*c, d = S.dir, px = -d.y, py = d.x;
  for (const s of [-1, 1]){
    const ex = hx + d.x*c*.12 + px*s*c*.22, ey = hy + d.y*c*.12 + py*s*c*.22;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(ex, ey, c*.16, 0, 7); ctx.fill();
    ctx.fillStyle = "#1b1b1b"; ctx.beginPath(); ctx.arc(ex + d.x*c*.05, ey + d.y*c*.05, c*.08, 0, 7); ctx.fill();
  }
  ctx.fillStyle = "#ff9ccb";
  for (const s of [-1, 1]){ ctx.beginPath(); ctx.arc(hx - d.x*c*.1 + px*s*c*.32, hy - d.y*c*.1 + py*s*c*.32, c*.07, 0, 7); ctx.fill() }
  if (!S.alive){ ctx.fillStyle = "#1b1b1b"; ctx.font = `${c*.5}px serif`; ctx.fillText("😵", hx, hy) }
}
addEventListener("resize", () => { if (S && $("#snake").classList.contains("on")){ const r = S.g; const g = sizeBoard(); if (g.cols === r.cols && g.rows === r.rows){ S.g = g; draw() } else startSnake() } });

/* ---------- Painel dos pais ---------- */
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"})[c]);
const fmtMin = m => m < 60 ? Math.round(m) + " min" : Math.floor(m/60) + " h " + Math.round(m % 60) + " min";
function sym(w){
  if (w.emoji) return w.emoji;
  if (w.color) return `<span class="sw" style="background:${w.color}"></span>`;
  return `<b>${w.num}</b>`;
}
function openParents(){
  show("parents");
  const L = nivel(), cnt = {sabe: 0, quase: 0, aprendendo: 0, nova: 0};
  C.words.forEach(w => cnt[status(w.id)]++);
  const tot = Object.values(stats.words).reduce((a, s) => ({voz: a.voz + s.voz1 + s.voz, ajuda: a.ajuda + s.ajuda, nao: a.nao + s.nao}), {voz: 0, ajuda: 0, nao: 0});
  const tent = tot.voz + tot.ajuda + tot.nao;
  const dias = Object.keys(stats.days).sort().reverse();
  const semana = dias.filter(d => (Date.now() - new Date(d + "T12:00").getTime()) < 7*864e5);
  const minSemana = semana.reduce((a, d) => a + stats.days[d].min, 0);
  const hoje = stats.days[today()] || {min: 0, palavras: 0};
  const pct = L.prox ? Math.round(100 * (L.n - L.base) / (L.prox[0] - L.base)) : 100;
  const ordem = {quase: 0, aprendendo: 1, sabe: 2, nova: 3};
  const linhas = C.words.slice().sort((a, b) => ordem[status(a.id)] - ordem[status(b.id)]).map(w => {
    const st = status(w.id), x = stats.words[w.id] || {vistas: 0, voz1: 0, voz: 0, ajuda: 0, nao: 0, ouviu: []};
    return `<tr><td class="wsym">${sym(w)}</td><td><b>${esc(w.en)}</b></td><td><span class="pill ${st}">${STATUS_TXT[st]}</span></td>
      <td class="n">${x.vistas}</td><td class="n">${x.voz1}</td><td class="n">${x.voz}</td><td class="n">${x.ajuda}</td><td class="n">${x.nao}</td>
      <td class="ouviu">${x.ouviu.map(esc).join(" · ") || "—"}</td></tr>`;
  }).join("");
  const diasHtml = dias.slice(0, 14).map(d => { const x = stats.days[d];
    return `<tr><td>${new Date(d + "T12:00").toLocaleDateString("pt-BR", {weekday: "short", day: "2-digit", month: "2-digit"})}</td>
      <td class="n">${fmtMin(x.min)}</td><td class="n">${x.palavras}</td><td class="n">${x.voz}</td><td class="n">${x.ajuda}</td><td class="n">${x.nao}</td><td class="n">${x.cobrinha}</td></tr>` }).join("")
    || `<tr><td colspan="7" class="muted">Ainda não tem nenhum dia registrado.</td></tr>`;

  $("#parents").innerHTML = `
    <h2>Painel dos pais</h2>
    <div class="muted">Registrando desde ${new Date(stats.inicio + "T12:00").toLocaleDateString("pt-BR")}. Os dados ficam salvos neste iPad.</div>
    <h3>Nível da Agnes</h3>
    <div class="lvl"><div class="big-ico">${L.ico}</div><div style="flex:1">
      <div style="font-size:26px;font-weight:700">${L.nome}</div>
      <div class="muted">Ela já sabe falar <b>${L.n} de ${C.words.length}</b> palavras${L.prox ? ` · faltam ${L.prox[0] - L.n} para o nível ${L.prox[2]} ${L.prox[1]}` : ""}</div>
      <div class="bar"><i style="width:${pct}%"></i></div></div></div>
    <div class="tiles">
      <div class="tile"><b>${cnt.sabe}</b><span>Sabe falar</span></div>
      <div class="tile"><b>${cnt.quase}</b><span>Quase lá</span></div>
      <div class="tile"><b>${cnt.aprendendo}</b><span>Aprendendo</span></div>
      <div class="tile"><b>${cnt.nova}</b><span>Ainda não viu</span></div>
      <div class="tile"><b>${tent ? Math.round(100*tot.voz/tent) : 0}%</b><span>Acertos falando (de ${tent} palavras)</span></div>
      <div class="tile"><b>${fmtMin(hoje.min)}</b><span>Tempo hoje</span></div>
      <div class="tile"><b>${fmtMin(minSemana)}</b><span>Últimos 7 dias</span></div>
      <div class="tile"><b>${stars}</b><span>Estrelinhas</span></div>
      <div class="tile"><b>${stats.roupas || 0}</b><span>Roupas trocadas no guarda-roupa</span></div>
      <div class="tile"><b>${stats.snake.recorde}</b><span>Recorde na cobrinha (${stats.snake.partidas} partidas)</span></div>
    </div>
    <h3>Palavras</h3>
    <div class="muted" style="margin-bottom:10px">“Sabe falar” = acertou de primeira, falando sozinha, 3 vezes seguidas. “O iPad ouviu” mostra como o reconhecimento entendeu a fala dela.</div>
    <div style="overflow-x:auto"><table class="ptable"><tr><th></th><th>Palavra</th><th>Situação</th><th>Vezes</th><th>De primeira</th><th>Repetindo</th><th>Com 👍</th><th>Não foi</th><th>O iPad ouviu</th></tr>${linhas}</table></div>
    <h3>Dia a dia</h3>
    <div style="overflow-x:auto"><table class="ptable"><tr><th>Dia</th><th>Tempo</th><th>Palavras</th><th>Falando</th><th>Com 👍</th><th>Não foi</th><th>Cobrinha</th></tr>${diasHtml}</table></div>
    <div class="pactions">
      <button id="pExport">⬇️ Salvar cópia dos dados</button>
      <label>⬆️ Carregar cópia<input type="file" id="pImport" accept=".json,application/json" hidden></label>
      <button class="danger" id="pReset">Zerar tudo</button>
    </div>
    <div class="muted" style="margin-top:10px">Dica: adicione o app à Tela de Início do iPad e salve uma cópia dos dados de vez em quando.</div>`;

  $("#pExport").onclick = () => {
    const blob = new Blob([JSON.stringify({app: "agnes-pad", salvo: new Date().toISOString(), stars, stats}, null, 2)], {type: "application/json"});
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `agnes-pad-${today()}.json`;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  $("#pImport").onchange = async e => {
    try{
      const d = JSON.parse(await e.target.files[0].text());
      if (d.app !== "agnes-pad" || !d.stats) throw 0;
      Object.keys(stats).forEach(k => delete stats[k]); Object.assign(stats, d.stats); saveStats();
      stars = d.stars || 0; store.set("stars", stars); showStars(); openParents();
    }catch(err){ e.target.value = ""; $("#pImport").parentElement.firstChild.textContent = "⚠️ Arquivo inválido " }
  };
  let armed = false;
  $("#pReset").onclick = () => {
    if (!armed){ armed = true; $("#pReset").textContent = "Toque de novo para apagar tudo"; setTimeout(() => { armed = false; const b = $("#pReset"); if (b) b.textContent = "Zerar tudo" }, 4000); return }
    Object.keys(stats).forEach(k => delete stats[k]);
    Object.assign(stats, {v: 1, inicio: today(), words: {}, days: {}, snake: {partidas: 0, recorde: 0, frutas: 0}}); saveStats();
    stars = 0; store.set("stars", 0); showStars(); openParents();
  };
}
$("#openParents").onclick = () => openParents();

  C.snakeFoods.forEach(f => load("en_" + f));
});
